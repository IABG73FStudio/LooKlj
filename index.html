<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LooKlj — твій простір для спілкування</title>
<meta name="description" content="LooKlj — українська платформа для відеозвонків, чатів та спільної роботи. Шість режимів, безпека, батьківський контроль, міні-ігри. © 2025 LooKlj. Всі права захищені. Копіювання, відтворення або розповсюдження матеріалів без письмового дозволу автора заборонено. Порушники будуть переслідуватися згідно з законом.">
<meta name="author" content="Denis">
<meta name="copyright" content="© 2025 LooKlj">
<meta name="theme-color" content="#1A1A2E">

<!-- Favicon (иконка сайта) встроена как SVG -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%237C5CFF'/%3E%3Cstop offset='100%25' stop-color='%235EC8C8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='256' cy='256' r='240' fill='%231A1A2E'/%3E%3Ccircle cx='256' cy='256' r='240' fill='none' stroke='url(%23g)' stroke-width='12'/%3E%3Ctext x='256' y='340' font-family='Arial,sans-serif' font-size='260' font-weight='900' text-anchor='middle' fill='url(%23g)'%3EL%3C/text%3E%3C/svg%3E">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>

<div class="container">
  <header>
    <div class="logo">Loo<span>Klj</span></div>
    <div class="langs">
      <button data-lang="uk" class="active">🇺🇦</button>
      <button data-lang="en">🇬🇧</button>
      <button data-lang="pl">🇵🇱</button>
      <button data-lang="de">🇩🇪</button>
      <button data-lang="fr">🇫🇷</button>
      <button data-lang="es">🇪🇸</button>
    </div>
  </header>

  <main>
    <h1 id="t_title">Вітаємо в LooKlj</h1>
    <p id="t_subtitle">Обери режим, щоб почати</p>

    <div class="modes">
      <button class="mode mode-school" onclick="pickMode('school')">
        <span class="ic">🏫</span>
        <span class="nm" id="t_school">Шкільний</span>
      </button>
      <button class="mode mode-work" onclick="pickMode('work')">
        <span class="ic">💼</span>
        <span class="nm" id="t_work">Робочий</span>
      </button>
      <button class="mode mode-personal" onclick="pickMode('personal')">
        <span class="ic">🏠</span>
        <span class="nm" id="t_personal">Особистий</span>
      </button>
      <button class="mode mode-child" onclick="pickMode('child')">
        <span class="ic">👶</span>
        <span class="nm" id="t_child">Для дитини</span>
      </button>
      <button class="mode mode-incognito" onclick="pickMode('incognito')">
        <span class="ic">🕵️</span>
        <span class="nm" id="t_incognito">Інкогніто</span>
      </button>
      <button class="mode mode-guest" onclick="pickMode('guest')">
        <span class="ic">👤</span>
        <span class="nm" id="t_guest">Гість (3 дні)</span>
      </button>
    </div>

    <div class="extra">
      <button class="extra-btn extra-install" onclick="installApp()">
        <span class="ic">📥</span>
        <span id="t_install">Встановити LooKlj</span>
      </button>
      <button class="extra-btn extra-projects" onclick="openProjects()">
        <span class="ic">🚀</span>
        <span id="t_projects">Мої інші проекти</span>
      </button>
    </div>
  </main>

  <footer>
    <span id="t_footer">© 2025 LooKlj. Всі права захищені.</span>
  </footer>
</div>

<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
